<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Windows 95 Solitaire Icon -->
  <defs>
    <filter id="win-shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="0" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Green table background badge -->
  <rect x="1" y="1" width="30" height="30" rx="3" fill="#008000" stroke="#000000" stroke-width="1"/>
  <rect x="2" y="2" width="28" height="28" rx="2" fill="none" stroke="#22b14c" stroke-width="1"/>

  <!-- Back Card (slightly angled) -->
  <rect x="5" y="4" width="16" height="23" rx="1.5" fill="#000080" stroke="#ffffff" stroke-width="1"/>
  <!-- Card back pattern -->
  <rect x="7" y="6" width="12" height="19" fill="#1084d0"/>
  <path d="M7 6l12 19M19 6L7 25" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>

  <!-- Front Card (Ace of Spades) -->
  <rect x="11" y="6" width="17" height="23" rx="1.5" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  
  <!-- "A" top-left -->
  <text x="13" y="12" font-family="'MS Sans Serif', Tahoma, Arial, sans-serif" font-size="6" font-weight="bold" fill="#000000">A</text>
  <!-- Small spade top-left -->
  <path d="M14.5 13.5 c-0.6-0.8-1.5-0.5-1.5 0.5 0 0.8 1.5 1.5 1.5 1.5 s1.5-0.7 1.5-1.5 c0-1-0.9-1.3-1.5-0.5 z M14.2 15 h0.6 v1.2 h-0.6 z" fill="#000000"/>

  <!-- Center Spade Large -->
  <path d="M19.5 13 c-1.5-2.2-4.5-1.2-4.5 1.5 0 2 4.5 4.5 4.5 4.5 s4.5-2.5 4.5-4.5 c0-2.7-3-3.7-4.5-1.5 z M18.7 18 h1.6 v3.2 h-1.6 z" fill="#000000"/>

  <!-- "A" bottom-right inverted -->
  <text x="24.5" y="26.5" font-family="'MS Sans Serif', Tahoma, Arial, sans-serif" font-size="5" font-weight="bold" fill="#000000" transform="rotate(180 24.5 24.5)">A</text>
</svg>
