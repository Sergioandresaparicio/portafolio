<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Windows 95 Retro Coolify Cube / Cloud Icon -->
  <rect x="2" y="2" width="28" height="28" fill="#6b17e8" stroke="#000000" stroke-width="1"/>
  <!-- Isometric Cube / Cloud Deploy -->
  <!-- Top Face -->
  <polygon points="16,6 25,11 16,16 7,11" fill="#a855f7" stroke="#ffffff" stroke-width="1"/>
  <!-- Left Face -->
  <polygon points="7,11 16,16 16,26 7,21" fill="#7c3aed" stroke="#ffffff" stroke-width="1"/>
  <!-- Right Face -->
  <polygon points="16,16 25,11 25,21 16,26" fill="#4c1d95" stroke="#ffffff" stroke-width="1"/>
  <!-- Coolify 'C' spark -->
  <circle cx="16" cy="11" r="2" fill="#ffcc00"/>
</svg>
