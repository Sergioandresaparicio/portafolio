<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Windows 95 Retro Linux Tux Penguin Icon -->
  <rect x="2" y="2" width="28" height="28" fill="#e0e0e0" stroke="#000000" stroke-width="1"/>
  <!-- Body (Black) -->
  <ellipse cx="16" cy="18" rx="8" ry="10" fill="#000000"/>
  <!-- Belly (White) -->
  <ellipse cx="16" cy="19" rx="5" ry="7" fill="#ffffff"/>
  <!-- Head (Black) -->
  <circle cx="16" cy="10" r="5" fill="#000000"/>
  <!-- Eyes -->
  <circle cx="14" cy="9" r="1.5" fill="#ffffff"/>
  <circle cx="14" cy="9" r="0.8" fill="#000000"/>
  <circle cx="18" cy="9" r="1.5" fill="#ffffff"/>
  <circle cx="18" cy="9" r="0.8" fill="#000000"/>
  <!-- Beak (Orange) -->
  <polygon points="14,11 18,11 16,14" fill="#ff9900"/>
  <!-- Feet (Orange) -->
  <ellipse cx="11" cy="27" rx="3" ry="1.5" fill="#ff9900"/>
  <ellipse cx="21" cy="27" rx="3" ry="1.5" fill="#ff9900"/>
</svg>
