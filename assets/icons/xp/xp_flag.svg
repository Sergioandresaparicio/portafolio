<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="xpRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4a22"/>
      <stop offset="100%" stop-color="#cc1c00"/>
    </linearGradient>
    <linearGradient id="xpGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cd000"/>
      <stop offset="100%" stop-color="#4e9900"/>
    </linearGradient>
    <linearGradient id="xpBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="xpYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#e69500"/>
    </linearGradient>
    <filter id="xpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Flag Waves -->
  <g filter="url(#xpGlow)">
    <!-- Red top-left -->
    <path d="M 6,7 C 12,9 18,5 23,8 L 22,23 C 17,20 11,24 6,22 Z" fill="url(#xpRed)" />
    <!-- Green top-right -->
    <path d="M 25,8 C 30,11 36,7 42,9 L 41,24 C 35,22 29,26 24,23 Z" fill="url(#xpGreen)" />
    <!-- Blue bottom-left -->
    <path d="M 6,24 C 11,26 17,22 22,25 L 21,40 C 16,37 10,41 5,39 Z" fill="url(#xpBlue)" />
    <!-- Yellow bottom-right -->
    <path d="M 24,25 C 29,28 35,24 41,26 L 40,41 C 34,39 28,43 23,40 Z" fill="url(#xpYellow)" />
  </g>
</svg>
