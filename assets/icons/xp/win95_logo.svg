<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="w95Bg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00a0a0"/>
      <stop offset="100%" stop-color="#006666"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="8" fill="url(#w95Bg)" stroke="#c0c0c0" stroke-width="2.5"/>
  <!-- Classic Pixel Windows 95 Logo -->
  <g transform="translate(10, 10) scale(0.9)">
    <!-- Red -->
    <rect x="8" y="6" width="12" height="12" fill="#ff0000" />
    <!-- Green -->
    <rect x="24" y="9" width="12" height="12" fill="#00ff00" />
    <!-- Blue -->
    <rect x="7" y="22" width="12" height="12" fill="#0000ff" />
    <!-- Yellow -->
    <rect x="23" y="25" width="12" height="12" fill="#ffff00" />
    <!-- Trailing pixel dots -->
    <rect x="38" y="11" width="3" height="3" fill="#00ff00"/>
    <rect x="42" y="13" width="2" height="2" fill="#00ff00"/>
    <rect x="37" y="27" width="3" height="3" fill="#ffff00"/>
  </g>
</svg>
